<table class='table' *ngIf="persons">
  <thead>
    <tr>
      <th></th>
      <th>Nombre</th>
      <th>Territorio</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let person of persons">
      <td>
        <button class="btn" *ngIf="canDelete">
          <i class="fa-solid fa-trash-can" style="color: red" data-bs-toggle="modal" data-bs-target="#deletePerson" (click)="(personNameToDelete = person.Name)"></i>

        </button>
      </td>
      <td>{{ person.Name }}</td>
      <td *ngIf="person.TerritoryName != null">{{person.TerritoryName}} ({{ person.TerritoryCode }})</td>
      <td *ngIf="person.TerritoryName == null">Sin asignar</td>
    </tr>
  </tbody>
</table>


<div class="modal fade" id="deletePerson" tabindex="-1" aria-labelledby="deletePersonLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <h4 class="col-12 text-center">¿Seguro que quieres eliminar a esta persona?</h4>
        <div class="row justify-content-center mt-3">
          <button type="button" class="btn btn-secondary col-3 me-2" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger col-3" (click)="deletePerson()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
