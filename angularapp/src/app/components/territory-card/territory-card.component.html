<div class="territory-card"
     (click)="onCardClick()">
  <div class="card-image">
    <img [src]="territory.imgUrl || './assets/img/testterritorio.png'" [alt]="territory.name">
    <div class="action-buttons">
      <button class="action-btn edit-btn" (click)="onEditClick($event)">
        <i class="fas fa-edit"></i>
      </button>
      <button class="action-btn delete-btn" (click)="onDeleteClick($event)">
        <i class="fas fa-trash-alt"></i>
      </button>
    </div>
  </div>
  <div class="card-content">
    <div class="card-header">
      <h3 class="card-title">{{ territory.name }}</h3>
      <span class="territory-code">{{ territory.code }}</span>
    </div>
    <div class="card-info">
      <div class="info-row">
        <div class="info-row__person" *ngIf="territory.personName">
          <i class="fas fa-user"></i>
          <span class="person-name">{{ territory.personName }}</span>
        </div>
        <span *ngIf="territory.givenDateUtc" class="given-date">{{ territory.givenDateUtc | timeago }}</span>
      </div>
    </div>
  </div>
</div>
