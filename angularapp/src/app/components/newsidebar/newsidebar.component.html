<aside class="sidebar shadow-sm">

  <div class="sidebar-toggler-inside ml-auto mr-3">
    <a class="btn nav-link" (click)="toggleSidebarPin()"><i class="fa fa-bars"></i></a>
  </div>

  <div class="sidebar-profile d-flex flex-column justify-content-center pt-5 pb-3">
    <div class="picture-wrapper mb-4">
      <div class="user-initial">
        {{ userService.getUserName()[0].toUpperCase() }}
      </div>
    </div>
    <div class="profile-details text-center pb-4">
      <p class="mb-0 text-uppercase name">{{ userService.getUserName() }}</p>
      <small class="text-uppercase role">{{ userService.getRoleString(userService.getRole())}}</small>
    </div>
  </div>
  <div class="sidebar-search pt-1 pb-1 pl-3 pr-3">
    <input type="search" class="form-control rounded-pill" name="search" placeholder="Search ...">
  </div>
  <nav class="sidebar-menu pt-3 pb-3">
    <div class="menu-header mt-3 mb-2">
      Components
    </div>
    <ul class="menu-items">
      <li>
        <a [routerLink]="['/territories']" [routerLinkActive]="['active']" (click)="toggleSidebar()">
          <i class="fas fa-address-card"></i>
          <span>Ver territorios</span>
        </a>
      </li>
      <li *ngIf="userService.roleMatch(['SUPERADMIN', 'ADMIN'])">
        <a [routerLink]="['/users']" [routerLinkActive]="['active']" (click)="toggleSidebar()">
          <i class="fas fa-user"></i>
          <span>Usuarios</span>
        </a>
      </li>
      <li>
        <a [routerLink]="['/add-person']" [routerLinkActive]="['active']" (click)="toggleSidebar()">
          <i class="fas fa-user-tie"></i>
          <span>Registrar hermano</span>
        </a>
      </li>
      <li>
        <a [routerLink]="['/persons']" [routerLinkActive]="['active']"  (click)="toggleSidebar()">
          <i class="fas fa-user-tie"></i>
          <span>Ver hermanos</span>
        </a>
      </li>
      <li *ngIf="userService.roleMatch(['SUPERADMIN'])">
        <a [routerLink]="['/action-logs']" [routerLinkActive]="['active']" (click)="toggleSidebar()">
          <i class="fa fa-globe"></i>
          <span>Action logs</span>
        </a>
      </li>
    </ul>
    <div class="view-source mt-3">
      <a (click)="logout()" class="btn btn-block btn-lightning rounded-0">Cerrar sesión</a>
    </div>
  </nav>
</aside>
