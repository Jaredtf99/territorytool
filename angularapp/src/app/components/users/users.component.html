<table class='table' *ngIf="users">
  <thead>
    <tr>
      <th></th>
      <th>UserID</th>
      <th>UserName</th>
      <th>Role</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>
        <div *ngIf="canConfigurate(user.Role!)">
          <i class="fa-solid fa-pen-to-square me-3" data-bs-toggle="modal" data-bs-target="#editUser" (click)="openEditModal(user.UserID)"></i>
          <i class="fa-solid fa-trash-can" data-bs-toggle="modal" data-bs-target="#deleteUser" (click)="assignIdToDelete(user.UserID!)"></i>
        </div>
      </td>
      <td>{{ user.UserID }}</td>
      <td>{{ user.UserName }}</td>
      <td>{{ user.Role }}</td>
    </tr>
  </tbody>
</table>


<div class="modal fade" id="editUser" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editUserLabel">Editar usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body row">
        <div class="col-12 col-sm-6 mb-3">
          <input type="text" class="form-control" placeholder="Nombre del usuario" [(ngModel)]="userToEdit.UserName">
          <div *ngIf="!userToEdit.UserName" class="alert alert-danger mt-2">Introduce el nombre del usuario</div>
        </div>
        <div class="col-12 col-sm-6">
          <select class="form-select" [(ngModel)]="userToEdit.Role">
            <option [value]="role" *ngFor="let role of rolesCanIChange">{{role}}</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" [disabled]="!userToEdit.UserName" (click)="editUser()">Editar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteUser" tabindex="-1" aria-labelledby="deleteUser" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center">
        <h4>¿Seguro que quieres eliminar este usuario?</h4>
        <div class="mt-3">
          <button type="button" class="btn btn-secondary me-3" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" (click)="deleteUser()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
