<table class='table' *ngIf="users">
  <thead>
    <tr>
      <th></th>
      <th>UserID</th>
      <th>UserName</th>
      <th>Role</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>
        <div *ngIf="canConfigurate(user.Role!)">
          <i class="fas fa-pencil-alt" data-bs-toggle="modal" data-bs-target="#editUser" (click)="openEditModal(user.UserID)"></i>
          <i class="fas fa-trash-alt" data-bs-toggle="modal" data-bs-target="#deleteUser" (click)="assignIdToDelete(user.UserID!)"></i>
        </div>
      </td>
      <td>{{ user.UserID }}</td>
      <td>{{ user.UserName }}</td>
      <td>{{ user.Role }}</td>
    </tr>
  </tbody>
</table>


<div class="modal fade" id="editUser" tabindex="-1" role="dialog" aria-labelledby="editUserLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editUserLabel">Editar usuario</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body row">

        <div class="col-xs-12 col-sm-6">
          <div class="form-group">
            <input type="text" class="form-control item" placeholder="Nombre del usuario" #ctrl="ngModel" [(ngModel)]="userToEdit.UserName">
          </div>

          <div *ngIf="userToEdit.UserName === null || userToEdit.UserName === ''" class="alert alert-danger">
            Introduce el nombre del usuario
          </div>
        </div>

        <div class="col-xs-12 col-sm-6">
          <app-selector [options]="rolesCanIChange" [default]="defaultRoleIndex" (selectionChanged)="selectedRoleEventHandler($event)"></app-selector>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" [disabled]="userToEdit.UserName === null || userToEdit.UserName === ''" (click)="editUser()">Editar</button>
      </div>
    </div>
  </div>
</div>


<div class="modal fade" id="deleteUser" tabindex="-1" role="dialog" aria-labelledby="deleteUser" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <h4 class="col-xs-12 text-center">¿Seguro que quieres eliminar este usuario?</h4>
        <div class="row">
          <button type="button" class="btn btn-secondary col-xs-3 col-xs-offset-2" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger col-xs-3 col-xs-offset-2" (click)="deleteUser()">Eliminar</button>

        </div>

      </div>
    </div>
  </div>
</div>
