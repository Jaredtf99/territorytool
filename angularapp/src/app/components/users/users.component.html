<div id="users_table"></div>


<div class="modal fade" id="editUser" tabindex="-1" aria-labelledby="editUserLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editUserLabel">Editar usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="editForm" class="row">
          <div class="col-12 col-sm-6 mb-3 form-group">
            <label>Nombre del usuario</label>
            <input type="text" class="form-control item" formControlName="userName" [ngClass]="{ 'is-invalid': editForm.get('userName')?.invalid && (editForm.get('userName')?.dirty || editForm.get('userName')?.touched) }">
            <div *ngIf="editForm.get('userName')?.invalid && (editForm.get('userName')?.dirty || editForm.get('userName')?.touched)" class="invalid-feedback d-block">
              <div *ngIf="editForm.get('userName')?.hasError('required')">Introduce el nombre del usuario</div>
              <div *ngIf="editForm.get('userName')?.hasError('usernameExists')">El nombre de usuario ya está en uso</div>
            </div>
          </div>

          <div class="col-12 col-sm-6 mb-3 form-group">
            <label>Rol</label>
            <select class="form-select item" formControlName="role">
              <option [value]="role" *ngFor="let role of rolesCanIChange">{{role}}</option>
            </select>
          </div>

          <div class="col-12 mb-3 form-group" *ngIf="canChangePassword">
            <label>Nueva Contraseña</label>
            <input type="password" class="form-control item" formControlName="newPassword">
            <div *ngIf="editForm.get('newPassword')?.invalid && (editForm.get('newPassword')?.dirty || editForm.get('newPassword')?.touched)" class="invalid-feedback d-block">
              <div *ngIf="editForm.get('newPassword')?.hasError('required')">Introduce la nueva contraseña</div>
              <div *ngIf="editForm.get('newPassword')?.hasError('minlength')">La contraseña debe tener al menos 8 caracteres</div>
            </div>
          </div>

          <div class="col-12 mb-3" *ngIf="canChangePassword">
            <button type="button" class="btn btn-warning" (click)="changePassword()" [disabled]="editForm.get('newPassword')?.invalid">Cambiar Contraseña</button>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary" [disabled]="editForm.invalid" (click)="editUser()">Editar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="deleteUser" tabindex="-1" aria-labelledby="deleteUser" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center">
        <h4>¿Seguro que quieres eliminar este usuario?</h4>
        <div class="mt-3">
          <button type="button" class="btn btn-secondary me-3" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" (click)="deleteUser()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
