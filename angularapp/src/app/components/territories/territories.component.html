<h1>Territorios</h1>

<div class="filters-container">
  <div class="filters">
    <input class="filters_item me-sm-2 col-12 col-sm-auto mb-3 mb-sm-0" type="text" name="filterName" placeholder="Nombre" #ctrl="ngModel" [(ngModel)]="filterName" (change)="getTerritories()" />

    <div class="filter-checkbox me-1 me-sm-2">
      <label>
        <input type="checkbox" name="free" #ctrl="ngModel" [(ngModel)]="free" (change)="onChangeFree()">
        <div class="filter-checkbox_text">
          Libres
        </div>
      </label>
    </div>

    <div class="filter-checkbox me-1 me-sm-2">
      <label>
        <input type="checkbox" name="inUse" #ctrl="ngModel" [(ngModel)]="inUse" (change)="onChangeInUse()">
        <div class="filter-checkbox_text">
          Ocupados
        </div>
      </label>
    </div>

    <div class="sorting d-flex d-sm-none">
      <span class="me-1 me-sm-2">Orden</span>
      <ng-select class="me-1 me-sm-2" [(ngModel)]="orderBy" [clearable]="false" [searchable]="false" (change)="getTerritories()">
        <ng-option [value]="1">Nombre</ng-option>
        <ng-option [value]="2">Hermano</ng-option>
        <ng-option [value]="3">Última vez</ng-option>
      </ng-select>
      <div class="sorting_direction">
        <label>
          <input type="checkbox" name="sortAscending" #ctrl="ngModel" [(ngModel)]="sortAscending" (change)="getTerritories()">
          <i class="fa-solid fa-arrow-up"></i>
        </label>
      </div>

    </div>

  </div>

  <div class="sorting d-none d-sm-flex">
    <span class="me-2">Orden</span>
    <ng-select class="me-2" [(ngModel)]="orderBy" [clearable]="false" [searchable]="false" (change)="getTerritories()">
      <ng-option [value]="1">Nombre</ng-option>
      <ng-option [value]="2">Hermano</ng-option>
      <ng-option [value]="3">Última vez</ng-option>
    </ng-select>
    <div class="sorting_direction">
      <label>
        <input type="checkbox" name="sortAscending" #ctrl="ngModel" [(ngModel)]="sortAscending" (change)="getTerritories()">
        <i class="fa-solid fa-arrow-up"></i>
      </label>
    </div>

  </div>


</div>


<div class="cards">

  <div class="territory-card me-3 mb-3" *ngFor="let territory of territoriesFiltered" (click)="detail(territory.id)">
    <div class="img">

      <img *ngIf="territory.imgUrl" [src]="territory.imgUrl" alt="Alternate Text" />
      <img *ngIf="!territory.imgUrl" src="./assets/img/testterritorio.png" alt="Alternate Text" />
      <div class="icon-container">
        <div class="icon" (click)="openEditModal(territory); $event.stopPropagation()">
          <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 512 512"><!--!Font Awesome Free 6.5.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2023 Fonticons, Inc.--><path d="M471.6 21.7c-21.9-21.9-57.3-21.9-79.2 0L362.3 51.7l97.9 97.9 30.1-30.1c21.9-21.9 21.9-57.3 0-79.2L471.6 21.7zm-299.2 220c-6.1 6.1-10.8 13.6-13.5 21.9l-29.6 88.8c-2.9 8.6-.6 18.1 5.8 24.6s15.9 8.7 24.6 5.8l88.8-29.6c8.2-2.7 15.7-7.4 21.9-13.5L437.7 172.3 339.7 74.3 172.4 241.7zM96 64C43 64 0 107 0 160V416c0 53 43 96 96 96H352c53 0 96-43 96-96V320c0-17.7-14.3-32-32-32s-32 14.3-32 32v96c0 17.7-14.3 32-32 32H96c-17.7 0-32-14.3-32-32V160c0-17.7 14.3-32 32-32h96c17.7 0 32-14.3 32-32s-14.3-32-32-32H96z" /></svg>
        </div>
        <div class="icon" (click)="assignIdToDelete(territory.id!); $event.stopPropagation()">
          <svg xmlns="http://www.w3.org/2000/svg" height="16" width="14" viewBox="0 0 448 512"><!--!Font Awesome Free 6.5.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2023 Fonticons, Inc.--><path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z" /></svg>
        </div>
      </div>
    </div>


    <div class="text">
      <p class="h3"> {{ territory.name }} <span class="badge text-bg-primary ms-1">{{ territory.code }}</span> </p>
      <p class="p">
        {{ territory.personName }} <span *ngIf="territory.givenDateUtc">{{ territory.givenDateUtc | timeago }}</span>
      </p>

    </div>
  </div>

</div>



<edit-territory-modal [territoryInfo]="territoryToEdit" (territoryUpdated)="territoryUpdatedCallback()"></edit-territory-modal>

<delete-territory-modal [territoryId]="idTerritoryToDelete" (territoryDeleted)="territoryDeleteCallback()"></delete-territory-modal>
