<div class="registration-form">

  <form [formGroup]="userService.changePasswordForm" (ngSubmit)="changePassword()" autocomplete="off">

    <div class="form-icon">
      <span><i class="fa-solid fa-key"></i></span>
    </div>
    <h3 class="text-center">Cambiar contraseña</h3>

    <div class="form-group mb-4">
      <label>Contraseña actual</label>
      <input type="password" class="form-control item" formControlName="OldPassword" 
             [ngClass]="{ 'is-invalid': (userService.changePasswordForm.get('OldPassword')!.invalid && (userService.changePasswordForm.get('OldPassword')!.dirty || userService.changePasswordForm.get('OldPassword')!.touched || submitted)) }">
      <div *ngIf="userService.changePasswordForm.get('OldPassword')!.invalid && (userService.changePasswordForm.get('OldPassword')!.dirty || userService.changePasswordForm.get('OldPassword')!.touched || submitted)" class="invalid-feedback d-block">
        <div *ngIf="userService.changePasswordForm.get('OldPassword')!.errors?.['required']">Introduce una contraseña</div>
        <div *ngIf="userService.changePasswordForm.get('OldPassword')!.errors?.['passwordMismatch']">La contraseña no es correcta</div>
      </div>
    </div>

    <div formGroupName="NewPasswords">

      <div class="form-group mb-4">
        <label>Nueva contraseña</label>
        <input type="password" class="form-control item" formControlName="Password" 
               [ngClass]="{ 'is-invalid': (userService.changePasswordForm.get('NewPasswords.Password')!.invalid && (userService.changePasswordForm.get('NewPasswords.Password')!.dirty || userService.changePasswordForm.get('NewPasswords.Password')!.touched || submitted)) }">
        <div *ngIf="userService.changePasswordForm.get('NewPasswords.Password')!.invalid && (userService.changePasswordForm.get('NewPasswords.Password')!.dirty || userService.changePasswordForm.get('NewPasswords.Password')!.touched || submitted)" class="invalid-feedback d-block">
          <div *ngIf="userService.changePasswordForm.get('NewPasswords.Password')!.errors?.['required']">Introduce una contraseña</div>
          <div *ngIf="userService.changePasswordForm.get('NewPasswords.Password')!.errors?.['minlength']">La contraseña debe tener mínimo 4 caracteres</div>
        </div>
      </div>

      <div class="form-group">
        <label>Repite la contraseña</label>
        <input type="password" class="form-control item" formControlName="ConfirmPassword" 
               [ngClass]="{ 'is-invalid': (userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.invalid && (userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.dirty || userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.touched || submitted)) }">
        <div *ngIf="userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.invalid && (userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.dirty || userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.touched || submitted)" class="invalid-feedback d-block">
          <div *ngIf="userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.errors?.['required']">Repite la contraseña</div>
          <div *ngIf="userService.changePasswordForm.get('NewPasswords.ConfirmPassword')!.errors?.['passwordMismatch']">Las contraseñas no coinciden</div>
        </div>
      </div>

    </div>

    <div class="form_buttons">
      <button type="submit" class="btn btn-primary" [disabled]="userService.changePasswordForm.invalid">Enviar</button>
    </div>
  </form>

</div>
