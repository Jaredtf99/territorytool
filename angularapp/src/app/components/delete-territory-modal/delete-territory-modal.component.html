<div class="modal fade" id="deleteTerritory" tabindex="-1" role="dialog" aria-labelledby="deleteTerritory" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <h4 class="col-xs-12 text-center">¿Seguro que quieres eliminar este territorio?</h4>
        <div class="row justify-content-center mt-3">
          <button type="button" class="btn btn-secondary col-3 me-2" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger col-3" (click)="deleteTerritory()">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
