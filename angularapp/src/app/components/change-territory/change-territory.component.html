<div class="registration-form">

  <form [formGroup]="giveTerritoryForm" (ngSubmit)="giveTerritory()">

    <div class="form-icon">
      <i class="fa-solid fa-elevator"></i>
    </div>

    <div class="territory-suggestions">
      <h3 class="suggestions-title">
        <i class="fas fa-lightbulb me-2"></i>Territorios recomendados
      </h3>
      
      <!-- Skeleton loader -->
      <div class="territory-list" *ngIf="loadingSuggestions">
        <div class="territory-skeleton" *ngFor="let i of [1,2,3]">
          <div class="skeleton-code skeleton-animate"></div>
          <div class="skeleton-name skeleton-animate"></div>
          <div class="skeleton-status skeleton-animate"></div>
        </div>
      </div>

      <!-- Contenido real -->
      <div class="territory-list" *ngIf="!loadingSuggestions">
        <div class="territory-item" 
             *ngFor="let territory of territorySuggestions; let i = index" 
             [class.selected]="selectedTerritory?.code === territory.code"
             [class.featured]="i === 0"
             (click)="selectSuggestedTerritory(territory)">
          <div class="territory-info">
            <span class="territory-code">{{territory.code}}</span>
            <h4 class="territory-name">{{territory.name}}</h4>
            <div class="territory-status">
              <i class="fas fa-clock"></i>
              <span *ngIf="!territory.lastPickedDate" class="not-used">
                Nunca usado
              </span>
              <span *ngIf="territory.lastPickedDate" class="last-used">
                {{territory.lastPickedDate | timeago}}
              </span>
            </div>
          </div>
          <span *ngIf="i === 0" class="featured-star">
            <i class="fas fa-star"></i>
          </span>
        </div>
      </div>
    </div>

    <div class="form-group mb-4">
      <label>Territorio</label>

      <ng-select id="changeTerritoryNgSelectTerritories"
                [items]="territories$ | async"
                [loading]="territoriesLoading"
                typeToSearchText="Introduce 2 o más caracteres"
                [typeahead]="territoriesInput$"
                bindLabel="name"
                formControlName="selectedTerritory"
                [(ngModel)]="selectedTerritory"
                (change)="onTerritorySelect($event)"
                [ngClass]="{ 'is-invalid': submitted && f['selectedTerritory'].errors }">
        <ng-template ng-label-tmp let-item="item">
          <span>{{item.name}}</span>
        </ng-template>
        <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
          <span>({{item.code}}) {{item.name}}</span>
          <!--Aqui se podria utilizar un badge para el code-->
        </ng-template>

      </ng-select>
    </div>


    <div class="form-group mb-2">
      <label>Persona</label>

      <ng-select [items]="persons$ | async"
                 [minTermLength]="3"
                 [loading]="personsLoading"
                 typeToSearchText="Introduce 2 o más caracteres"
                 [typeahead]="personsInput$"
                 bindLabel="name"
                 [(ngModel)]="selectedPerson"
                 formControlName="selectedPerson"
                 id="changeTerritoryNgSelectPerson">
      </ng-select>
    </div>


    <div class="form-group">
      <label>Fecha manual</label>
      <div class="checkbox-wrapper-2 ms-1">
        <input type="checkbox" class="ikxBAC" formControlName="customDate">
      </div>

      <input *ngIf="f['customDate'].value" type="datetime-local" class="form-control item" formControlName="date" [ngClass]="{ 'is-invalid': f['date'].invalid && (f['date'].dirty || f['date'].touched) }"/>
      <div *ngIf="f['date'].errors && f['customDate'].value" class="invalid-feedback d-block">
        <div *ngIf="f['date'].errors?.['dateBeforeLastPicked']">La fecha no puede ser anterior a la última fecha de recogida</div>
      </div>

    </div>


    <div class="form_buttons">
      <button type="submit" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalScanner" (click)="startQrScanner()"><i class="fa fa-qrcode me-2"></i>Escanear QR</button>

      <button type="submit" class="btn btn-primary" [disabled]="!giveTerritoryForm.valid">Entregar territorio</button>
    </div>

  </form>

</div>

<div class="modal fade" id="modalScanner" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-bs-dismiss="modal" (click)="stopQrScanner()">
          <span aria-hidden="true">&times;</span><span class="sr-only">Cerrar</span>
        </button>
        <h4 class="modal-title" id="myModalLabel">Escanear QR</h4>
      </div>
      <div class="modal-body">
        <ngx-scanner-qrcode #action="scanner" [config]="config" (event)="onEvent($event, action)"></ngx-scanner-qrcode>
      </div>

    </div>
  </div>
</div>
