<div class="container py-4">
  <h3 class="mb-4"><i class="fa fa-church me-2"></i>Congregaciones</h3>

  <div class="card mb-4">
    <div class="card-body">
      <label class="form-label">Nueva congregación</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Nombre de la congregación"
               [(ngModel)]="newName" (keyup.enter)="create()">
        <button class="btn btn-primary" type="button" (click)="create()" [disabled]="!newName.trim()">
          <i class="fa fa-plus me-1"></i>Crear
        </button>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Nombre</th>
          <th style="width: 160px">Tu rol</th>
          <th style="width: 200px" class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of congregations">
          <td>
            <ng-container *ngIf="editingId === c.id; else showName">
              <input type="text" class="form-control form-control-sm" [(ngModel)]="editingName"
                     (keyup.enter)="saveEdit(c)">
            </ng-container>
            <ng-template #showName>
              {{ c.name }}
              <span *ngIf="c.is_active" class="badge bg-success ms-2">activa</span>
            </ng-template>
          </td>
          <td><span class="badge bg-secondary">{{ c.role }}</span></td>
          <td class="text-end">
            <ng-container *ngIf="editingId === c.id; else actions">
              <button class="btn btn-sm btn-success me-1" (click)="saveEdit(c)"><i class="fa fa-check"></i></button>
              <button class="btn btn-sm btn-secondary" (click)="cancelEdit()"><i class="fa fa-xmark"></i></button>
            </ng-container>
            <ng-template #actions>
              <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(c)"><i class="fa fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" (click)="remove(c)"><i class="fa fa-trash"></i></button>
            </ng-template>
          </td>
        </tr>
        <tr *ngIf="congregations.length === 0">
          <td colspan="3" class="text-center text-muted">No hay congregaciones</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
