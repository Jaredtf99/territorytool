<table class='table' *ngIf="persons">
  <thead>
    <tr>
      <th></th>
      <th>Nombre</th>
      <th>Territorio</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let person of persons">
      <td>
        <div *ngIf="canDelete">
          <i class="fas fa-trash-alt" data-toggle="modal" href="#deletePerson" (click)="(personNameToDelete = person.Name)"></i>
        </div>
      </td>
      <td>{{ person.Name }}</td>
      <td *ngIf="person.TerritoryName != null">{{person.TerritoryName}} ({{ person.TerritoryCode }})</td>
      <td *ngIf="person.TerritoryName == null">Sin asignar</td>
    </tr>
  </tbody>
</table>


<div class="modal fade" id="deletePerson" tabindex="-1" role="dialog" aria-labelledby="deletePerson" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <h4 class="col-xs-12 text-center">¿Seguro que quieres elminar este hermano?</h4>
        <div class="row">
          <button type="button" class="btn btn-secondary col-xs-3 col-xs-offset-2" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger col-xs-3 col-xs-offset-2" (click)="deletePerson()">Eliminar</button>

        </div>

      </div>
    </div>
  </div>
</div>
