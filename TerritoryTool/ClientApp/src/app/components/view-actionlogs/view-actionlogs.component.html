<table class='table' *ngIf="actionlogs">
  <thead>
    <tr>
      <th>Type</th>
      <th>DateUTC</th>
      <th>UserName</th>
      <th>Message</th>
      <th>Successful</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let actionlog of actionlogs">
      <td>{{ actionlog.ActionType }}</td>
      <td>{{ actionlog.DateUtc }}</td>
      <td>{{ actionlog.UserName }}</td>
      <td>{{ actionlog.Message }}</td>
      <td>{{ actionlog.Successful }}</td>
    </tr>
  </tbody>
</table>
