<div class='main-nav'>
    <div class='navbar navbar-inverse'>
      <div class='navbar-header'>
        <button type='button' class='navbar-toggle' data-toggle='collapse' data-target='.navbar-collapse' [attr.aria-expanded]='isExpanded' (click)='toggle()'>
          <span class='sr-only'>Toggle navigation</span>
          <span class='icon-bar'></span>
          <span class='icon-bar'></span>
          <span class='icon-bar'></span>
        </button>
        <a class='navbar-brand' [routerLink]='["/home"]'>TerritoryTool</a>
        <div class="navbar-user" (click)='toggle()'>
          <span>{{userService.getUserName()}}</span>
          <button [routerLink]='["/user-configuration"]'>
            <i class="fas fa-user-cog"></i>
          </button>
        </div>
      </div>
        <div class='clearfix'></div>
        <div class='navbar-collapse collapse' [ngClass]='{ "in": isExpanded }'>
          <ul class='nav navbar-nav'>
            <li [routerLinkActive]='["link-active"]'>
              <a [routerLink]='["/territories"]' (click)='collapse()'>
                <i class="fas fa-address-card mr-5px"></i> Ver territorios
              </a>
            </li>
            <li *ngIf="userService.roleMatch(['SUPERADMIN', 'ADMIN'])" [routerLinkActive]='["link-active"]'>
              <a [routerLink]='["/add-territory"]' (click)='collapse()'>
                <i class="fas fa-folder-plus mr-5px"></i> Nuevo territorio
              </a>
            </li>
            <li *ngIf="userService.roleMatch(['SUPERADMIN', 'ADMIN'])" [routerLinkActive]='["link-active"]'>
              <a [routerLink]='["/registration"]' (click)='collapse()'>
                <i class="fas fa-user-plus mr-5px"></i> Registrar usuario
              </a>
            </li>
            <li *ngIf="userService.roleMatch(['SUPERADMIN'])" [routerLinkActive]='["link-active"]'>
              <a [routerLink]='["/action-logs"]' (click)='collapse()'>
                <i class="fas fa-file-contract mr-5px"></i> Action logs
              </a>
            </li>
            <li [routerLinkActive]='["link-active"]'>
              <a (click)='logout()'>
                <i class="fas fa-sign-out-alt mr-5px"></i> Cerrar sesión
              </a>
            </li>
          </ul>
        </div>
    </div>
</div>
