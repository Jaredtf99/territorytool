<div class="registration-form">

  <form [formGroup]="addTerritoryForm" (ngSubmit)="addTerritory()">

    <div class="form-icon">
      <span><i class="fas fa-folder-plus"></i></span>
    </div>

    <div class="form-group">
      <input type="text" class="form-control item" placeholder="Código de territorio" formControlName="code">
    </div>

    <div *ngIf="(submitted || f.code.dirty || f.code.touched) && f.code.errors" class="alert alert-danger">
      <div *ngIf="f.code.errors.required">Introduce el código de territorio</div>
    </div>


    <div class="form-group">
      <input type="text" class="form-control item" placeholder="Nombre" formControlName="name" [ngClass]="{ 'is-invalid': f.name.errors }">
    </div>

    <div *ngIf="(submitted || f.name.dirty || f.name.touched) && f.name.errors" class="alert alert-danger">
      <div *ngIf="f.name.errors.required">Introduce el nombre del territorio</div>
    </div>

    <div class="form-group input-group">
      <input type="text" class="form-control item" placeholder="URL del mapa" style="border-radius:20px 0px 0px 20px" formControlName="mapUrl" [ngClass]="{ 'is-invalid': f.mapUrl.errors }">
      <span class="input-group-btn" style="vertical-align: top;">
        <button class="btn btn-default" type="button" style="border-radius:0px 20px 20px 0px" data-toggle="modal" href="#mi_modal" (click)="scanQrCode()"><i class="fa fa-qrcode"></i></button>
      </span>
    </div>

    <div *ngIf="(submitted || f.mapUrl.dirty || f.mapUrl.touched) && f.mapUrl.errors" class="alert alert-danger">
      <div *ngIf="f.mapUrl.errors.required">Introduce la URL del mapa del territorio</div>
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-block create-account" >Añadir territorio</button>
    </div>

  </form>

</div>



<div class="modal fade" id="mi_modal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" (click)="stopQrScanner()">
          <span aria-hidden="true">&times;</span><span class="sr-only">Cerrar</span>
        </button>
        <h4 class="modal-title" id="myModalLabel">Escanear QR</h4>
      </div>
      <div class="modal-body">
        <video id="scanner"></video>
      </div>

    </div>
  </div>
</div>
